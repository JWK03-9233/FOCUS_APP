[project]
name = "focus_app"
version = "0.3.11"
description = "허용 목록 기반 집중 모드 앱 (Windows, PySide6)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
focus-app = "focus_app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["focus_app*"]

[tool.setuptools.package-data]
focus_app = ["assets/*.ico", "assets/*.png"]
