# focus_app/version.py의 버전이 바뀐 커밋이 main에 올라오면
# 테스트 → exe 빌드 → GitHub Release(v<버전>) 생성 및 zip 업로드를 자동으로 합니다.
# 이미 같은 버전의 릴리스가 있으면 아무것도 하지 않습니다.
name: Release

on:
  push:
    branches: [main]
    paths: ["focus_app/version.py"]
  workflow_dispatch: # Actions 탭에서 직접 실행도 가능

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 읽기
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path focus_app/version.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $m) { throw "focus_app/version.py에서 버전을 찾지 못했습니다" }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "버전: $v"

      - name: 이미 릴리스된 버전인지 확인
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "found=true" >> $env:GITHUB_OUTPUT; Write-Host "이미 있음 - 건너뜀" }
          else { "found=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.exists.outputs.found == 'false'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 의존성 설치
        if: steps.exists.outputs.found == 'false'
        run: python -m pip install -r requirements-dev.txt

      - name: 테스트
        if: steps.exists.outputs.found == 'false'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: exe 빌드
        if: steps.exists.outputs.found == 'false'
        run: pyinstaller --noconfirm installer/FocusApp.spec

      - name: zip 만들기
        if: steps.exists.outputs.found == 'false'
        id: pack
        shell: pwsh
        run: |
          $name = "FocusApp-${{ steps.ver.outputs.tag }}-win64.zip"
          Compress-Archive -Path dist/FocusApp -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"
          "zip=$name" >> $env:GITHUB_OUTPUT

      - name: 릴리스 만들기
        if: steps.exists.outputs.found == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "release_notes.md"
          if (Test-Path CHANGELOG.md) {
            # CHANGELOG.md에서 이번 버전 절만 꺼내 릴리스 설명으로 사용
            $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
            $pattern = '(?ms)^##\s*\[?v?' + [regex]::Escape("${{ steps.ver.outputs.version }}") + '\]?.*?$(.*?)(?=^##\s|\z)'
            $m = [regex]::Match($text, $pattern)
            if ($m.Success) { $m.Groups[1].Value.Trim() | Out-File -Encoding utf8 $notes }
          }
          $ghArgs = @("${{ steps.ver.outputs.tag }}", "${{ steps.pack.outputs.zip }}", "${{ steps.pack.outputs.zip }}.sha256",
                    "--repo", "${{ github.repository }}", "--target", "${{ github.sha }}",
                    "--title", "FocusApp ${{ steps.ver.outputs.tag }}")
          if (Test-Path $notes) { $ghArgs += @("--notes-file", $notes) } else { $ghArgs += "--generate-notes" }
          gh release create @ghArgs
